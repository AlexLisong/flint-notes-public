server {
    listen 80;
    server_name flint.example.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/flint-acme; }
    location / { return 301 https://flint.example.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name flint.example.com;
    ssl_certificate /etc/letsencrypt/live/flint.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flint.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 32m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://127.0.0.1:4317;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
